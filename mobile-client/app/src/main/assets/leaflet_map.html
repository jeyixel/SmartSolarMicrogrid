<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar Microgrid Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100%; }
        /* Custom styles for Leaflet popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .leaflet-popup-content {
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #0B3B24;
            margin: 12px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([6.9271, 79.8612], 12);
        L.control.zoom({position: 'topright'}).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markers = {};
        var userMarker = null;

        // Called from Kotlin to center the map
        function setCenter(lat, lng, zoom) {
            map.setView([lat, lng], zoom);
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.circleMarker([lat, lng], {
                    color: '#fff',
                    fillColor: '#00796B',
                    fillOpacity: 1,
                    radius: 8,
                    weight: 2
                }).addTo(map).bindPopup("You are here");
            }
        }

        // Called from Kotlin to add stations
        function addMarker(id, lat, lng, name, isActive) {
            var color = isActive ? '#2E7D32' : '#F57F17';
            var markerHtmlStyles = `
              background-color: ${color};
              width: 1.5rem;
              height: 1.5rem;
              display: block;
              left: -0.75rem;
              top: -0.75rem;
              position: relative;
              border-radius: 50%;
              border: 3px solid #FFFFFF;
              box-shadow: 0px 2px 4px rgba(0,0,0,0.3);
            `;

            var icon = L.divIcon({
                className: "my-custom-pin",
                iconAnchor: [0, 24],
                labelAnchor: [-6, 0],
                popupAnchor: [0, -36],
                html: `<span style="${markerHtmlStyles}"></span>`
            });

            var marker = L.marker([lat, lng], {icon: icon}).addTo(map);
            marker.bindPopup(name);

            marker.on('click', function(e) {
                // Tell Android a marker was clicked
                Android.onMarkerClick(id);
            });

            markers[id] = marker;
        }

        function clearMarkers() {
            for (var id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};
        }
    </script>
</body>
</html>
